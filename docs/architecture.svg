<svg viewBox="0 0 1370 862" width="1370" height="862" role="img" aria-label="UnitWatt architecture: five kinds of factory paperwork pass through format adapters into one daily ledger. The ledger feeds an energy model reused by savings proof, emissions and drift alarms, an idle-waste check, and a tariff engine that drives the bill check and the scheduler. Rupee findings are ranked into the owner&#x27;s message; reports go to the banker, the EU buyer and the supervisor; every input is hashed into an audit trail." xmlns="http://www.w3.org/2000/svg">
<title>UnitWatt architecture</title>
<style>
:root,svg{--bg:#f5f7f6;--box:#ffffff;--fg:#17201d;--muted:#5d6b66;--line:#7f8c87;--accent:#0f6b5c;--accent-ink:#0b5a4c;--tint:#e3f1ed;--warn:#b7791f;--warn-bg:#fdf3e1;--warn-ink:#8a5a12;--ui-font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono-font:'IBM Plex Mono',ui-monospace,Menlo,monospace;}
@media (prefers-color-scheme: dark){:root,svg{--bg:#121715;--box:#1a211e;--fg:#e4ebe8;--muted:#9aa8a3;--line:#7d8b86;--accent:#3fb8a2;--accent-ink:#6fd0bd;--tint:#16302a;--warn:#e0a54a;--warn-bg:#2e2412;--warn-ink:#f0c27a;}}

.bg{fill:var(--bg)}
.bx{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.bx.ledger{fill:var(--tint);stroke:var(--accent);stroke-width:1.6}
.bx.audit{fill:var(--box);stroke:var(--line)}
.bx.plan{fill:none;stroke:var(--muted);stroke-dasharray:2 4;stroke-width:1.4}
.pill{fill:var(--warn-bg);stroke:var(--warn);stroke-dasharray:4 3;stroke-width:1.2}
.pt{fill:var(--warn-ink);font:600 10px var(--mono-font)}
.t1{fill:var(--fg);font:600 13px var(--ui-font)}
.t2{fill:var(--muted);font:400 11px var(--ui-font)}
.t2.em{fill:var(--accent-ink)}
.mono{fill:var(--muted);font:400 10px var(--mono-font)}
.hd{fill:var(--fg);font:600 11.5px var(--ui-font);letter-spacing:.06em;text-transform:uppercase}
.al{fill:var(--muted);font:400 10px var(--ui-font)}
.ar{fill:none;stroke:var(--line);stroke-width:1.3}
.ar.plan{stroke:var(--muted);stroke-dasharray:2 4}
.ahp{fill:var(--line)}
.ahq{fill:var(--muted)}
</style>
<rect class="bg" x="0" y="0" width="1370" height="862"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahq" d="M0,0 L10,5 L0,10 z"/></marker></defs>
